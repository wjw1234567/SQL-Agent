# ================================================================
# Kafka + Flink + Paimon 环境
# 镜像源说明：
#   Kafka + Zookeeper: confluentinc/cp-kafka (替代已下线的 bitnami/kafka)
#   Flink: 官方 flink:1.18-java11
# ================================================================
# 注意: Paimon 不是独立服务，而是 Flink 的连接器 JAR。
# 启动后需要手动下载 Paimon JAR 放入 Flink lib 目录:
#   wget https://repo1.maven.org/maven2/org/apache/paimon/paimon-flink-1.18/0.7.0/paimon-flink-1.18-0.7.0.jar
#   docker cp paimon-flink-1.18-0.7.0.jar flink-jm:/opt/flink/lib/
#   docker restart flink-jm flink-tm
# ================================================================

networks:
  sql-agent-net:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zk
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    mem_limit: 512m
    networks:
      - sql-agent-net



  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ../data/kafka:/var/lib/kafka/data
    mem_limit: 2g
    depends_on:
      - zookeeper
    networks:
      - sql-agent-net

  flink-jobmanager:
    image: apache/flink:1.18.1-scala_2.12-java11
    container_name: flink-jm
    ports:
      - "8081:8081"
      - "6123:6123"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jm
        jobmanager.memory.process.size: 2048m
    volumes:
      - ../data/paimon:/opt/paimon/data
      - ./flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./sql:/opt/flink/sql
      - ./flink-job:/opt/flink/job
    mem_limit: 2g
    networks:
      - sql-agent-net

  flink-taskmanager:
    image: apache/flink:1.18.1-scala_2.12-java11
    container_name: flink-tm
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jm
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ../data/paimon:/opt/paimon/data
      - ./flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./sql:/opt/flink/sql
      - ./flink-job:/opt/flink/job
    mem_limit: 4g
    depends_on:
      - flink-jobmanager
    networks:
      - sql-agent-net
