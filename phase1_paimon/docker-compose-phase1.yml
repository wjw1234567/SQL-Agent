version: '3.8'

networks:
  sql-agent-net:
    driver: bridge

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zk
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    mem_limit: 512m
    networks:
      - sql-agent-net

  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://:9092,EXTERNAL://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
    volumes:
      - ../data/kafka:/bitnami/kafka/data
    mem_limit: 2g
    depends_on:
      - zookeeper
    networks:
      - sql-agent-net

  flink-jobmanager:
    image: flink:1.18-java11
    container_name: flink-jm
    ports:
      - "8081:8081"
      - "6123:6123"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jm
        jobmanager.memory.process.size: 2048m
    volumes:
      - ../data/paimon:/opt/paimon/data
      - ./flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./sql:/opt/flink/sql
      - ./flink-job:/opt/flink/job
    mem_limit: 2g
    networks:
      - sql-agent-net

  flink-taskmanager:
    image: flink:1.18-java11
    container_name: flink-tm
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jm
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ../data/paimon:/opt/paimon/data
      - ./flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./sql:/opt/flink/sql
      - ./flink-job:/opt/flink/job
    mem_limit: 4g
    depends_on:
      - flink-jobmanager
    networks:
      - sql-agent-net
