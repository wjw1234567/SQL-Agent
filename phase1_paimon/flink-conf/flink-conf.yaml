# Flink Configuration
jobmanager.rpc.address: flink-jm
jobmanager.memory.process.size: 2048m
taskmanager.memory.process.size: 4096m
taskmanager.numberOfTaskSlots: 4

# Checkpoint (required for Paimon exactly-once writes)
execution.checkpointing.interval: 30s
execution.checkpointing.mode: EXACTLY_ONCE
state.backend: hashmap
state.checkpoints.dir: s3://paimon-bucket/checkpoints

# S3 (MinIO) configuration - Flink's S3 FS plugin uses these for Hadoop S3A
s3.endpoint: http://minio:9000
s3.path.style.access: true
s3.access-key: minioadmin
s3.secret-key: minioadmin

# Paimon specific
# Paimon jars must be placed in /opt/flink/lib/ or added via ADD JAR
blob.server.port: 6124
query.server.port: 6125

# ================================================================
# Fallback: Local filesystem configuration
