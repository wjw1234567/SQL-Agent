version: '3.8'

# Phase 2: 在 Phase 1 基础上增加 Doris FE 和 BE
# 使用方式: docker compose -f docker-compose-phase2.yml up -d

networks:
  sql-agent-net:
    driver: bridge

services:
  # ========== Phase 1 服务 (完整移植) ==========
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zk
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    mem_limit: 512m
    networks:
      - sql-agent-net

  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://:9092,EXTERNAL://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
    volumes:
      - ../data/kafka:/bitnami/kafka/data
    mem_limit: 2g
    depends_on:
      - zookeeper
    networks:
      - sql-agent-net

  flink-jobmanager:
    image: flink:1.18-java11
    container_name: flink-jm
    ports:
      - "8081:8081"
      - "6123:6123"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jm
        jobmanager.memory.process.size: 2048m
    volumes:
      - ../data/paimon:/opt/paimon/data
      - ../phase1_paimon/flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./sql:/opt/flink/sql
      - ./flink-job:/opt/flink/job
    mem_limit: 2g
    networks:
      - sql-agent-net

  flink-taskmanager:
    image: flink:1.18-java11
    container_name: flink-tm
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jm
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ../data/paimon:/opt/paimon/data
      - ../phase1_paimon/flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./sql:/opt/flink/sql
      - ./flink-job:/opt/flink/job
    mem_limit: 4g
    depends_on:
      - flink-jobmanager
    networks:
      - sql-agent-net

  # ========== Phase 2 新增: Doris ==========
  doris-fe:
    image: apache/doris:2.0.3-fe
    container_name: doris-fe
    ports:
      - "9030:9030"    # MySQL 协议端口
      - "8030:8030"    # Doris WebUI
    volumes:
      - ./doris-init:/opt/doris/init
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-P", "9030", "-uroot", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - sql-agent-net

  doris-be:
    image: apache/doris:2.0.3-be
    container_name: doris-be
    ports:
      - "9050:9050"
    mem_limit: 4g
    depends_on:
      doris-fe:
        condition: service_healthy
    networks:
      - sql-agent-net
