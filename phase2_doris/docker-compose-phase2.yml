# ================================================================
# Phase 2: Kafka + Flink + Paimon + Doris 全环境
# 镜像源说明：
#   Kafka + Zookeeper: confluentinc/cp-kafka
#   Flink: apache/flink:1.18.1-scala_2.12-java11
#   MinIO: minio/minio (S3-compatible object storage for Paimon)
#   Doris: apache/doris:2.0.3
# ================================================================
# 注意: Paimon 不是独立服务，而是 Flink 的连接器 JAR。
# ================================================================

networks:
  sql-agent-net:
    driver: bridge

services:
  # ========== Phase 1 服务 (完整移植) ==========
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zk
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    mem_limit: 512m
    networks:
      - sql-agent-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ../data/kafka:/var/lib/kafka/data
    mem_limit: 2g
    depends_on:
      - zookeeper
    networks:
      - sql-agent-net

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ../data/minio:/data
    command: server /data --console-address ":9001"
    mem_limit: 512m
    networks:
      - sql-agent-net

  minio-init:
    image: minio/mc:RELEASE.2024-10-13T13-34-11Z
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until (/usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin) do sleep 2; done;
      echo 'Creating bucket paimon-bucket...';
      /usr/bin/mc mb myminio/paimon-bucket --ignore-existing;
      echo 'Bucket created successfully';
      "
    networks:
      - sql-agent-net

  flink-jobmanager:
    image: apache/flink:1.18.1-scala_2.12-java11
    container_name: flink-jm
    ports:
      - "8081:8081"
      - "6123:6123"
    command: >
      /bin/sh -c "
      cp /opt/flink/opt/flink-s3-fs-hadoop-*.jar /opt/flink/lib/ &&
      exec /docker-entrypoint.sh jobmanager
      "
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jm
        jobmanager.memory.process.size: 2048m
    volumes:
      # - ../data/paimon:/opt/paimon/data     # 备用：取消注释以使用本地文件存储
      - ../phase1_paimon/flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./sql:/opt/flink/sql
      - ./flink-job:/opt/flink/job
    mem_limit: 2g
    depends_on:
      - minio-init
    networks:
      - sql-agent-net

  flink-taskmanager:
    image: apache/flink:1.18.1-scala_2.12-java11
    container_name: flink-tm
    command: >
      /bin/sh -c "
      cp /opt/flink/opt/flink-s3-fs-hadoop-*.jar /opt/flink/lib/ &&
      exec /docker-entrypoint.sh taskmanager
      "
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jm
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 4
    volumes:
      # - ../data/paimon:/opt/paimon/data     # 备用：取消注释以使用本地文件存储
      - ../phase1_paimon/flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./sql:/opt/flink/sql
      - ./flink-job:/opt/flink/job
    mem_limit: 4g
    depends_on:
      - flink-jobmanager
    networks:
      - sql-agent-net

  # ========== Phase 2 新增: Doris ==========
  doris-fe:
    image: apache/doris:2.0.3-fe
    container_name: doris-fe
    ports:
      - "9030:9030"    # MySQL 协议端口
      - "8030:8030"    # Doris WebUI
    volumes:
      - ./doris-init:/opt/doris/init
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-P", "9030", "-uroot", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - sql-agent-net

  doris-be:
    image: apache/doris:2.0.3-be
    container_name: doris-be
    ports:
      - "9050:9050"
    mem_limit: 4g
    depends_on:
      doris-fe:
        condition: service_healthy
    networks:
      - sql-agent-net
